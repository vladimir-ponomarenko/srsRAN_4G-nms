db_uri: mongodb://mongo-5g/open5gs

logger:
  level: info

global:
  max:
    ue: 16
  parameter:
    no_scp: true
    no_sepp: true
    no_mme: true
    no_sgwc: true
    no_sgwu: true
    no_pcrf: true
    no_hss: true

nrf:
  serving:
    - plmn_id:
        mcc: 208
        mnc: 99
  sbi:
    server:
      - address: 127.0.0.10
        port: 7777

udr:
  sbi:
    server:
      - address: 127.0.0.20
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777

udm:
  hnet:
    - id: 1
      scheme: 1
      key: /etc/open5gs/hnet/curve25519-1.key
    - id: 2
      scheme: 2
      key: /etc/open5gs/hnet/secp256r1-2.key
  sbi:
    server:
      - address: 127.0.0.12
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777

ausf:
  sbi:
    server:
      - address: 127.0.0.11
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777

pcf:
  sbi:
    server:
      - address: 127.0.0.13
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
  metrics:
    server:
      - address: 127.0.0.13
        port: 9090

nssf:
  sbi:
    server:
      - address: 127.0.0.14
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
      nsi:
        - uri: http://127.0.0.10:7777
          s_nssai:
            sst: 1
            sd: ffffff

bsf:
  sbi:
    server:
      - address: 127.0.0.15
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
  ngap:
    server:
      - address: 10.55.0.10
  metrics:
    server:
      - address: 127.0.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: 208
        mnc: 99
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 208
        mnc: 99
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: 208
        mnc: 99
      s_nssai:
        - sst: 1
          sd: ffffff
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS-OAI-RFSIM
    short: O5GS
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540

smf:
  sbi:
    server:
      - address: 127.0.0.4
        port: 7777
    client:
      nrf:
        - uri: http://127.0.0.10:7777
  pfcp:
    server:
      - address: 127.0.0.4
    client:
      upf:
        - address: 127.0.0.7
  gtpc:
    server:
      - address: 127.0.0.4
  gtpu:
    server:
      - address: 127.0.0.4
  metrics:
    server:
      - address: 127.0.0.4
        port: 9090
  session:
    - subnet: 12.1.1.0/24
      gateway: 12.1.1.1
      dnn: oai
  dns:
    - 8.8.8.8
    - 1.1.1.1
  mtu: 1400
  info:
    - s_nssai:
        - sst: 1
          sd: ffffff
          dnn:
            - oai
      tai:
        - plmn_id:
            mcc: 208
            mnc: 99
          tac: 1

upf:
  pfcp:
    server:
      - address: 127.0.0.7
  gtpu:
    server:
      - address: 10.55.0.10
  session:
    - subnet: 12.1.1.0/24
      gateway: 12.1.1.1
      dnn: oai
      dev: ogstun
  metrics:
    server:
      - address: 127.0.0.7
        port: 9090
